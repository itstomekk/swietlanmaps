<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Świetlan Maps · przeglądarka map regionalizmów</title>
<meta name="description" content="Interaktywna przeglądarka map regionalizmów Świetlan Maps: słowa, powiaty, warianty.">
<link rel="icon" href="data:,">
<style>
  :root {
    --paper: #f4efe6; --paper2: #ebe4d6; --ink: #2b2622; --muted: #5c5248; --line: #cfc5b4;
    --l0: #e4dccd; --l1: #e4dccd; --l1s: #6f6458; --l2: #df9a45; --l3: #b5372b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink);
    font: 15px/1.45 "Iowan Old Style", "Palatino Linotype", Georgia, serif; }
  .app { display: grid; grid-template-columns: 270px minmax(0, 1fr) 300px; grid-template-rows: minmax(0, 1fr);
    height: 100vh; height: 100dvh; }
  aside { display: flex; flex-direction: column; min-height: 0; padding: 22px 18px 0; border-right: 1px solid var(--line); }
  .list { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 18px; }
  .info { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); }
  .info-body { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 18px; }
  .info footer { flex: none; border-top: 1px solid var(--line); padding: 10px 18px 12px; font-size: 12.5px; color: var(--muted); }
  .info footer a { color: var(--ink); }
  h1 { font-size: 22px; line-height: 1.15; margin: 0 0 14px; font-weight: 600; letter-spacing: .2px; }
  input[type=search] { width: 100%; padding: 7px 10px; border: 1px solid var(--line); background: #fbf8f2;
    font: inherit; font-size: 14px; border-radius: 3px; color: var(--ink); margin-bottom: 10px; }
  .list button { display: block; width: 100%; text-align: left; border: 0; background: none; font: inherit;
    color: var(--ink); padding: 8px 10px; border-radius: 3px; cursor: pointer; border-left: 3px solid transparent; }
  .list button:hover { background: var(--paper2); }
  .list button.on { background: var(--paper2); border-left-color: var(--ink); }
  .list .w { font-weight: 600; font-size: 16px; }
  .list .m { color: var(--muted); font-size: 12.5px; }
  .nav { display: grid; gap: 4px; margin-bottom: 6px; }
  .list button.feat { display: flex; align-items: center; gap: 10px; border-left: 0; padding: 7px 8px; background: color-mix(in srgb, var(--c) 9%, transparent); }
  .list button.feat:hover { background: color-mix(in srgb, var(--c) 18%, transparent); }
  .list button.feat.on { background: var(--c); color: #fbf8f2; }
  .list button.feat.on .m { color: rgba(251,248,242,.85); }
  .ico { flex: none; width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; background: var(--c); color: #fbf8f2; }
  .ico svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .list button.feat.on .ico { background: rgba(251,248,242,.18); }
  .list button.fold .w::after { content: "▸"; margin-left: 6px; font-size: 12px; display: inline-block; transition: transform .15s; }
  .list button.fold.open .w::after { transform: rotate(90deg); }
  .list .sub { margin: 0 0 6px 18px; border-left: 2px solid color-mix(in srgb, #3f7f3a 35%, transparent); }
  .list .sub button { padding: 5px 10px; } .list .sub .w { font-size: 14.5px; }
  .qnav { margin-top: 10px; display: flex; gap: 6px; }
  .chip:disabled { opacity: .4; cursor: default; border-color: var(--line); }
  .hide { display: none !important; }
  main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
    background: #b3d197; --muted: #45503a; } /* land around Poland, like a physical map */
  .head { flex: none; padding: 20px 26px 0; }
  .head .word { font-size: 34px; font-weight: 600; line-height: 1.1; }
  .head .mean { color: var(--muted); font-style: italic; }
  .map-wrap { flex: 1; min-height: 0; position: relative; padding: 6px 16px 10px; }
  svg { width: 100%; height: 100%; display: block; }
  .pw { stroke: rgba(60,45,30,.28); stroke-width: 1; cursor: pointer; transition: fill .25s; }
  .pw:hover { stroke: var(--ink); stroke-width: 2.4; }
  .pw.sel { stroke: var(--ink); stroke-width: 3.4; }
  .woj { fill: none; stroke: var(--ink); stroke-width: 2; opacity: .55; pointer-events: none; }
  .tools { flex: none; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 0 26px 16px; font-size: 13.5px; color: var(--muted); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 18px; height: 12px; display: inline-block; border: 1px solid rgba(0,0,0,.12); }
  .tip { position: fixed; pointer-events: none; background: #fbf8f2; border: 1px solid var(--line); padding: 8px 10px;
    font-size: 13px; box-shadow: 0 3px 12px rgba(40,30,20,.12); border-radius: 3px; display: none; max-width: 240px; z-index: 5; }
  .tip b { font-size: 14px; }
  .bars { display: flex; height: 7px; margin-top: 6px; border-radius: 2px; overflow: hidden; background: var(--l0); }
  .info h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .info .blk { margin-bottom: 22px; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px dotted var(--line); font-size: 14px; }
  .row .lv { white-space: nowrap; color: var(--muted); font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; }
  .note { font-size: 12px; color: var(--muted); }
  .note a { color: var(--ink); }
  label { cursor: pointer; }
  input[type=range] { width: 110px; vertical-align: middle; accent-color: var(--ink); }
  .list h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 14px 10px 4px; font-weight: 600; }
  .sibs { margin-top: 6px; font-size: 13.5px; color: var(--muted); }
  .chip { display: inline-block; border: 1px solid var(--line); border-radius: 12px; padding: 1px 9px; margin: 2px 3px 2px 0;
    background: #fbf8f2; color: var(--ink); cursor: pointer; font: inherit; font-size: 13px; }
  .chip:hover { border-color: var(--ink); }
  .chip.var { font-size: 11.5px; letter-spacing: 1.2px; font-weight: 600; background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: baseline; }
  .row.click { cursor: pointer; } .row.click:hover span:first-child { text-decoration: underline; }
  .pw.sel2 { stroke: #2f6b8f; stroke-width: 4; }
  .tag { display: inline-block; vertical-align: middle; font-size: 11px; letter-spacing: .8px; text-transform: uppercase; font-weight: 600;
    border: 1px solid var(--ink); border-radius: 3px; padding: 0 6px; margin-left: 4px; }
  .big { font-size: 19px; font-weight: 600; line-height: 1.3; }
  .mini { margin: 6px 0 2px; font-size: 13px; color: var(--muted); }
  .chip.ghost { background: none; color: var(--muted); }
  .qcard { margin-top: 8px; font-size: 16px; color: var(--ink); }
  .qcard .chip { font-size: 14px; padding: 3px 12px; margin-top: 7px; }
  .blk h2 + .big { margin-top: -2px; }
  @media (max-width: 1000px) {
    .list h3 { display: none; }
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) 25dvh; }
    aside { flex-direction: row; flex-wrap: wrap; align-items: center; column-gap: 10px; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 12px 4px; }
    h1 { font-size: 17px; margin: 0; white-space: nowrap; }
    input[type=search] { flex: 1; width: auto; min-width: 0; margin: 0; padding: 5px 9px; }
    .list { width: 100%; margin-top: 6px; }
    .list { flex: none; display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; padding-bottom: 4px; }
    .list button { width: auto; white-space: nowrap; border-left: 0; border-bottom: 2px solid transparent; padding: 5px 9px; }
    .list button.on { border-bottom-color: var(--ink); background: var(--ink); color: var(--paper); }
    .list .w { font-size: 14.5px; }
    .list .m { display: none; }
    .nav, .list .sub { display: contents; }
    .list button.feat { padding: 3px 9px 3px 4px; gap: 6px; } .ico { width: 24px; height: 24px; } .ico svg { width: 15px; height: 15px; }
    .head { padding: 6px 14px 0; } .head .word { font-size: 19px; } .head .mean { font-size: 13px; }
    .sibs { font-size: 12.5px; }
    .map-wrap { padding: 2px 4px; }
    .tools { padding: 0 14px 6px; gap: 4px 10px; font-size: 12px; line-height: 1.3; } .legend { gap: 2px 8px; }
    .info { border-left: 0; border-top: 1px solid var(--line); }
    .info-body { padding: 12px 14px; }
    .info footer { padding: 6px 14px 8px; font-size: 11.5px; }
    .qcard { font-size: 15px; } .qcard .chip { padding: 6px 14px; }
  }
</style>
</head>

// ---- "Skąd jestem?" quiz: Bayes over powiaty, adaptive questions ----
const PL = [.08, .35, .6, .85]; // chance that someone from a powiat uses the word, by map level
function norm(lk) { return lk.map(a => a.map((x, i) => x / lk.reduce((s, b) => s + b[i], 0))); }
const qPool = [];
DATA.concepts.forEach(c => { const lk = c.maps.map(m => m.lv.map(v => PL[v]));
  lk.push(Array.from({length: N}, (_, i) => .5 * c.maps.reduce((s, m) => s * (1 - PL[m.lv[i]]), 1)));
  qPool.push({c, labels: [...c.maps.map(m => m.word), "inaczej"], v: norm(lk)}); });
DATA.maps.filter(m => !conceptOf[m.fbid] && m.n >= N * .04 && m.n <= N * .85).forEach(m =>
  qPool.push({m, labels: ["tak", "nie"], v: [m.lv.map(v => PL[v]), m.lv.map(v => 1 - PL[v])]}));
const ent = p => { let h = 0; for (const x of p) if (x > 0) h -= x * Math.log(x); return h; };
function qzPost(ans) { const p = new Array(N).fill(1 / N);

  return p; }
function qzNext(p, ans, rnd = true) {
  const asked = new Set(ans.map(a => a[0])), h0 = ent(p);
  const sc = qPool.filter(q => !asked.has(q)).map(q => { let eh = 0;
    q.v.forEach(v => { let s = 0; const r = p.map((x, i) => { const y = x * v[i]; s += y; return y; }); if (s > 0) eh += s * ent(r.map(y => y / s)); });
    return [q, h0 - eh]; }).sort((a, b) => b[1] - a[1]);
  return sc.length ? sc[rnd ? Math.floor(Math.random() * Math.min(3, sc.length)) : 0][0] : null;
}
const qz = {ans: [], p: null, q: null};
function quizStart() { qz.ans = []; qz.p = qzPost([]); qz.q = qzNext(qz.p, []); }
function quizAnswer(o) { if (!qz.q) return; qz.ans.push([qz.q, o]); qz.p = qzPost(qz.ans); qz.q = qzNext(qz.p, qz.ans); renderQuiz(); }
function renderQuiz() {

  $("word").textContent = "Skąd jestem?";
  $("mean").textContent = "Odpowiadaj na pytania o słowa, a mapa pokaże, skąd najpewniej pochodzisz.";

    (q.m ? `Czy mówisz „${q.m.word}”? <span class="note">‘${q.m.meaning}’</span>` : `Jak mówisz na: <b>‘${q.c.key}’</b>?`) + `<br>` +
    q.labels.map((l, o) => `<button class="chip" data-qa="${o}">${l}</button>`).join("") + `<button class="chip ghost" data-qa="-1">nie wiem</button>`
    : `Koniec pytań.`) + `<div class="qnav"><button class="chip ghost" data-act="undo"${n ? "" : " disabled"}>← cofnij</button>` +
    (n ? `<button class="chip ghost" data-act="restart">zacznij od nowa</button>` : "") + `</div></div>`;
  const mx = Math.max(...p);

  $("legend").innerHTML = `<span>${sw(heat(0))}mało prawdopodobne</span><span>${sw(heat(.5))}</span><span>${sw(heat(1))}najbardziej prawdopodobne</span>`;
  const top = p.map((x, i) => [x, i]).sort((a, b) => b[0] - a[0]).slice(0, 5);
  const wp = {}; p.forEach((x, i) => wp[DATA.powiaty[i].woj] = (wp[DATA.powiaty[i].woj] || 0) + x);
  const tw = Object.entries(wp).sort((a, b) => b[1] - a[1]).slice(0, 3);

      tw.slice(1).map(([w, x]) => row(`woj. ${w}`, pct(x))).join("") +
      H2("Powiaty") + top.map(([x, i]) => row(short(DATA.powiaty[i].name), pct(x), `data-sel="${i}"`)).join("") +
      H2(`Twoje odpowiedzi (${n})`) + qz.ans.map(([q, o]) => row(q.m ? q.m.word : `‘${q.c.key}’`, o < 0 ? "nie wiem" : q.labels[o])).join("") +
      `<div style="margin-top:10px"><button class="chip ghost" data-act="restart">zacznij od nowa</button></div>`
    : `<h2>Jak to działa</h2><div class="note">Każda odpowiedź zawęża mapę. Następne pytanie to zawsze to, które najwięcej rozstrzyga. Po 8–12 pytaniach wynik zwykle jest już wyraźny.</div>`;

function compareBlock(a, b) {

// variants view: a powiat with several words gets diagonal stripes, one per word, width = level
const STRIPE = 9, patMade = {};
function stripes(parts) { // parts: [[variantIndex, level], ...]
  const id = "st-" + parts.map(([k, l]) => k + "_" + l).join("-");
  if (!patMade[id]) {
    const tot = parts.reduce((s, [, l]) => s + l, 0) * STRIPE;
    const pt = document.createElementNS(svgNS, "pattern");
    pt.id = id; pt.setAttribute("patternUnits", "userSpaceOnUse");
    pt.setAttribute("width", tot); pt.setAttribute("height", tot); pt.setAttribute("patternTransform", "rotate(45)");
    let x = 0, h = `<rect width="${tot}" height="${tot}" fill="#f4efe6"/>`;
    parts.forEach(([k, l]) => { h += `<rect x="${x}" width="${l * STRIPE}" height="${tot}" fill="${vcol(k)}"/>`; x += l * STRIPE; }); // full colour: stripe width carries the level
    pt.innerHTML = h; $("map").querySelector("defs").appendChild(pt); patMade[id] = 1;
  }
  return `url(#${id})`;
}
const blend = (hex, a) => { const c = [1, 3, 5].map(k => parseInt(hex.slice(k, k + 2), 16)), p = [244, 239, 230];
  return `rgb(${c.map((v, i) => Math.round(p[i] + (v - p[i]) * a)).join(",")})`; };
function variantFill(c, i) {
  const parts = c.maps.map((m, k) => [k, m.lv[i]]).filter(([, l]) => l > 0).sort((a, b) => b[1] - a[1] || a[0] - b[0]);
  if (!parts.length) return [LV[0].fill, 1, 0];
  if (parts.length === 1) return [blend(vcol(parts[0][0]), VOP[parts[0][1]]), 1, 1]; // solid mix with paper, so the green surroundings don't tint it
  return [stripes(parts), 1, parts.length];
}

  const p = DATA.powiaty[sel];
  const rows = DATA.maps.filter(m => m.lv[sel] > 0).sort((a, b) => b.lv[sel] - a.lv[sel] || coll.compare(a.word, b.word));
  let h = `<h2>${p.name}</h2><div class="note" style="margin-bottom:8px">woj. ${p.woj} · ${rows.length} z ${DATA.maps.length} słów w użyciu · ${idxRank[sel]}. miejsce z ${N} w indeksie regionalności</div>`;
  h += cmp !== null ? compareBlock(sel, cmp) : `<button class="chip ghost" data-act="cmp">${cmpPick ? "kliknij drugi powiat na mapie…" : "porównaj z innym powiatem"}</button>`;
  const loc = rows.filter(m => m.n <= LOCAL).sort((a, b) => a.n - b.n);
  if (loc.length) h += H2("Prawie tylko tutaj") + loc.map(m => row(m.word, `w ${m.n} pow.`, `data-key="m:${m.fbid}"`)).join("");
  const sim = DATA.powiaty.map((q, i) => [i, dot(pz[sel], pz[i])]).filter(([i]) => i !== sel).sort((a, b) => b[1] - a[1]);
  const far = sim.filter(([i]) => dist(i, sel) > FAR).slice(0, 2);
  h += H2("Mówi się podobnie jak w") + sim.slice(0, 3).map(([i, r]) => row(short(DATA.powiaty[i].name), pct(r), `data-sel="${i}"`)).join("") +
    (far.length ? `<div class="mini">daleko stąd:</div>` + far.map(([i, r]) => row(`${short(DATA.powiaty[i].name)} <small>(${DATA.powiaty[i].woj})</small>`, pct(r), `data-sel="${i}"`)).join("") : "");
  $("sel-blk").innerHTML = h + H2("Wszystkie słowa w użyciu") +
    rows.map(m => `<div class="row click" data-key="m:${m.fbid}"><span>${m.word}</span><span class="lv">${sw(LV[m.lv[sel]].fill)}${LV[m.lv[sel]].name}</span></div>`).join("");
}

// interactions
const tip = $("tip");
$("g-pw").addEventListener("mousemove", e => {
  if (!e.target.dataset || e.target.dataset.i === undefined || !view) return;
  const i = +e.target.dataset.i, p = DATA.powiaty[i];
  let body;
  if (view.type === "index") body = `${idx[i]} pkt regionalności`;
  else if (view.type === "stats") body = `${localN[i]} lokalnych słów`;
  else if (view.type === "quiz") body = `${pct(qz.p[i])} szans`;
  else if (view.type === "concept") body = view.c.maps.map((m, k) => [m, k]).sort((a, b) => b[0].lv[i] - a[0].lv[i]).map(([m, k]) =>
    `<div><i class="dot" style="background:${vcol(k)};opacity:${m.lv[i] ? 1 : .25}"></i>${m.word}: ${LV[m.lv[i]].name}</div>`).join("");
  else {
    const m = view.m, s = m.sh[i];
    body = `<span>${LV[m.lv[i]].name}</span><div class="bars">` +
      [[s[2], LV[3].fill], [s[1], LV[2].fill], [s[0], LV[1].bar]].map(([v, c]) => `<i style="width:${v * 100}%;background:${c}"></i>`).join("") + `</div>`;
  }
  tip.innerHTML = `<b>${short(p.name)}</b><br><span class="note">woj. ${p.woj}</span><br>${body}`;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + "px";
});
$("g-pw").addEventListener("mouseleave", () => tip.style.display = "none");
$("g-pw").addEventListener("click", e => {
  if (!e.target.dataset || e.target.dataset.i === undefined) return;
  const i = +e.target.dataset.i;
  if (cmpPick && sel !== null && i !== sel) { cmp = i; cmpPick = false; } else { sel = sel === i ? null : i; cmp = null; cmpPick = false; }
  renderSel();
});
document.addEventListener("click", e => {
  const a = e.target.closest("[data-sel],[data-qa],[data-act]");
  if (a) { if (a.dataset.sel !== undefined) { sel = +a.dataset.sel; cmp = null; cmpPick = false; renderSel(); }
    else if (a.dataset.qa !== undefined) quizAnswer(+a.dataset.qa); else act(a.dataset.act); return; }
  const t = e.target.closest("[data-key]");
  if (t && !t.closest("#list")) show(t.dataset.key);
});
$("ov").onchange = applyOverlay; $("op").oninput = applyOverlay;
$("q").oninput = e => renderList(e.target.value);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { sel = cmp = null; cmpPick = false; renderSel(); }
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && document.activeElement !== $("q")) {
    const btns = [...$("list").querySelectorAll("button[data-key]")], keys = btns.map(b => b.dataset.key);
    const i = keys.indexOf(listKey(view)) + (e.key === "ArrowDown" ? 1 : -1);
    if (i >= 0 && i < keys.length) { sel = cmp = null; cmpPick = false; show(keys[i]); $("list").querySelector(`button[data-key="${CSS.escape(keys[i])}"]`).scrollIntoView({block: "nearest"}); e.preventDefault(); }
  }
});
renderList();
const start = decodeURIComponent(location.hash.slice(1));
const valid = k => ["index", "stats", "quiz"].includes(k) || (k.startsWith("m:") && byFb[k.slice(2)]) || (k.startsWith("c:") && DATA.concepts.some(c => c.key === k.slice(2)));
show(valid(start) ? start : DATA.concepts.length ? "c:" + DATA.concepts[0].key : "m:" + DATA.maps[0].fbid);
</script>
</body>
</html>
